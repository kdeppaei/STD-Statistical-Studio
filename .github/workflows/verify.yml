name: Verify standalone release

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build standalone HTML
        run: python scripts/build.py
      - name: Verify synchronized release
        run: python tests/verify_release.py
      - name: Check inline JavaScript syntax
        run: node tests/check_inline_script.mjs dist/std_statistical_studio.html
      - name: Ensure generated release is committed
        run: git diff --exit-code -- dist/std_statistical_studio.html docs/index.html
